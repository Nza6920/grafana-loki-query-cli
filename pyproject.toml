[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-query"
version = "0.1.2"
description = "Query Loki logs through Grafana datasource proxies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "New Chiwan"}]
dependencies = []

[project.optional-dependencies]
dev = ["mypy==2.3.1"]

[project.scripts]
loki-query = "loki_query.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
